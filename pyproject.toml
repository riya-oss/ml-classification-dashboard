[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-assignment-2"
version = "0.1.0"
description = "Machine learning assignment project scaffold"
readme = "README.md"
requires-python = ">=3.10"
authors = [
	{ name = "Riya Thakur" }
]
dependencies = [
	"numpy>=1.26",
	"pandas>=2.2",
	"scikit-learn>=1.5",
	"matplotlib>=3.8",
	"seaborn>=0.13",
	"jupyter>=1.0",
	"streamlit>=1.37",
	"joblib>=1.4",
	"openpyxl>=3.1.5",
	"xgboost>=2.0",
	"imbalanced-learn>=0.14.2",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.2",
	"pytest-cov>=5.0",
	"ruff>=0.5",
	"pre-commit>=3.7"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
    "notebooks"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function calls in default arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # allow assert in tests
"notebooks/**/*.py" = ["E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
